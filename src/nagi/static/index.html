<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nagi · Grid Agent</title>
<meta name="description" content="Nagi: a regime-aware grid trading agent on BNB Chain. Live status, hires, earnings, trades and Set and Earn progress.">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* ── Design tokens: every size, space and colour below comes from here ── */
  :root {
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --text-xs: 12px; --lh-xs: 16px;
    --text-sm: 13px; --lh-sm: 20px;
    --text-md: 15px; --lh-md: 22px;
    --text-lg: 18px; --lh-lg: 26px;
    --text-xl: 28px; --lh-xl: 34px;
    --w-regular: 400; --w-medium: 500; --w-semibold: 600;
    --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-6: 24px; --s-8: 32px;
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-full: 999px;

    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f1f3f6; --line: #e5e7eb;
    --ink: #0f172a; --ink-2: #475569; --muted: #94a3b8;
    --positive: #059669; --positive-soft: #d1fae5;
    --warning: #b45309; --warning-soft: #fef3c7;
    --negative: #dc2626; --negative-soft: #fee2e2;
    --info: #2563eb; --info-soft: #dbeafe;
    --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 4px 16px rgba(15, 23, 42, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f17; --surface: #121826; --surface-2: #1a2232; --line: #1f2a3c;
      --ink: #e2e8f0; --ink-2: #a5b1c4; --muted: #64748b;
      --positive: #34d399; --positive-soft: #0f2e25;
      --warning: #fbbf24; --warning-soft: #33270b;
      --negative: #f87171; --negative-soft: #3a1414;
      --info: #60a5fa; --info-soft: #132443;
      --shadow: none;
    }
  }

  /* ── Base ── */
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html { -webkit-font-smoothing: antialiased; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font);
         font-size: var(--text-md); line-height: var(--lh-md); font-weight: var(--w-regular);
         font-variant-numeric: tabular-nums; }
  a { color: var(--info); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .xs { font-size: var(--text-xs); line-height: var(--lh-xs); }
  .sm { font-size: var(--text-sm); line-height: var(--lh-sm); }
  .md { font-size: var(--text-md); line-height: var(--lh-md); }
  .lg { font-size: var(--text-lg); line-height: var(--lh-lg); font-weight: var(--w-semibold); }
  .xl { font-size: var(--text-xl); line-height: var(--lh-xl); font-weight: var(--w-semibold); letter-spacing: -.01em; }
  .mono { font-family: var(--mono); font-size: var(--text-sm); line-height: var(--lh-sm); font-weight: var(--w-medium); }
  .strong { font-weight: var(--w-semibold); }
  .ink-2 { color: var(--ink-2); } .muted { color: var(--muted); }
  .pos { color: var(--positive); } .neg { color: var(--negative); } .warn { color: var(--warning); } .info { color: var(--info); }

  .wrap { max-width: 1080px; margin: 0 auto; padding: var(--s-8) var(--s-4); display: grid; gap: var(--s-4); }

  /* ── Header ── */
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-4); padding-bottom: var(--s-2); }
  .head img { width: 48px; height: 48px; border-radius: var(--radius-md); box-shadow: var(--shadow); }
  .head .who { flex: 1 1 240px; min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: var(--s-2); }

  /* ── Chip / badge (one style) ── */
  .chip { display: inline-flex; align-items: center; gap: var(--s-2); height: 24px; padding: 0 var(--s-3);
          border-radius: var(--radius-full); background: var(--surface-2); color: var(--ink-2);
          font-size: var(--text-xs); line-height: var(--lh-xs); font-weight: var(--w-medium); white-space: nowrap; }
  .chip i { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--muted); }
  .chip.pos { background: var(--positive-soft); color: var(--positive); } .chip.pos i { background: var(--positive); }
  .chip.neg { background: var(--negative-soft); color: var(--negative); } .chip.neg i { background: var(--negative); }
  .chip.warn { background: var(--warning-soft); color: var(--warning); } .chip.warn i { background: var(--warning); }
  .chip.info { background: var(--info-soft); color: var(--info); } .chip.info i { background: var(--info); }

  /* ── Card ── */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
          padding: var(--s-6); box-shadow: var(--shadow); min-width: 0; }
  .card-head { display: flex; align-items: center; gap: var(--s-2); margin-bottom: var(--s-4); }
  .card-head .aside { margin-left: auto; }

  /* ── KPI tiles ── */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-4); }
  .kpi { display: grid; gap: var(--s-1); }
  .kpi .label { display: flex; align-items: center; gap: var(--s-2); }

  /* ── Help tooltip ── */
  .help { position: relative; display: inline-grid; place-items: center; width: 16px; height: 16px;
          border-radius: var(--radius-full); background: var(--surface-2); color: var(--ink-2);
          font-size: var(--text-xs); line-height: var(--lh-xs); font-weight: var(--w-semibold); cursor: help; }
  .help:hover::after, .help:focus::after { content: attr(data-tip); position: absolute; z-index: 10; top: 24px; left: 50%;
          transform: translateX(-50%); width: 280px; padding: var(--s-3); border-radius: var(--radius-md);
          background: var(--ink); color: var(--bg); font-size: var(--text-sm); line-height: var(--lh-sm);
          font-weight: var(--w-regular); text-align: left; }

  /* ── Progress ── */
  .progress { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-6); }
  .goal { display: grid; gap: var(--s-2); }
  .goal .row { display: flex; justify-content: space-between; gap: var(--s-2); }
  .bar { height: 8px; border-radius: var(--radius-full); background: var(--surface-2); overflow: hidden; }
  .bar span { display: block; height: 100%; border-radius: var(--radius-full); background: var(--info); }
  .bar span.done { background: var(--positive); }

  /* ── Lists (one row style) ── */
  .list { display: grid; }
  .item { display: grid; gap: var(--s-1); padding: var(--s-3) 0; border-bottom: 1px solid var(--line); min-height: 48px; }
  .item:first-child { padding-top: 0; } .item:last-child { border-bottom: 0; padding-bottom: 0; }
  .item .line { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-3); }
  .item .line .end { margin-left: auto; }
  .empty { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4); border-radius: var(--radius-md);
           background: var(--surface-2); color: var(--ink-2); }

  /* ── Layout rows ── */
  .split { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: var(--s-4); }

  /* ── Grid ladder ── */
  .ladder { display: grid; gap: var(--s-1); }
  .lv { display: flex; justify-content: space-between; padding: var(--s-1) var(--s-3); border-radius: var(--radius-sm); }
  .lv.now { background: var(--surface-2); font-weight: var(--w-semibold); }
  .paused { display: grid; gap: var(--s-1); padding: var(--s-6) var(--s-4); border-radius: var(--radius-md);
            background: var(--warning-soft); color: var(--warning); text-align: center; }

  /* ── Tabs ── */
  .tabs { display: flex; gap: var(--s-1); margin-left: auto; padding: var(--s-1); border-radius: var(--radius-full); background: var(--surface-2); }
  .tabs button { border: 0; cursor: pointer; height: 28px; padding: 0 var(--s-3); border-radius: var(--radius-full);
                 background: transparent; color: var(--ink-2); font: inherit; font-size: var(--text-sm);
                 line-height: var(--lh-sm); font-weight: var(--w-medium); }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  .dot { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--muted); flex: none; }
  .dot.pos { background: var(--positive); } .dot.warn { background: var(--warning); } .dot.neg { background: var(--negative); } .dot.info { background: var(--info); }

  footer { display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-6); padding-top: var(--s-2); }
  footer .end { margin-left: auto; }

  @media (max-width: 880px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .split { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 600px) {
    .progress { grid-template-columns: minmax(0, 1fr); gap: var(--s-4); }
    .card { padding: var(--s-4); }
    .card-head { flex-wrap: wrap; }
    .tabs { margin-left: 0; }
    footer .end { margin-left: 0; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <img src="/logo.png" alt="Nagi logo">
    <div class="who">
      <div class="lg">Nagi</div>
      <div class="sm ink-2" id="who-sub">Grid agent · BNB Chain testnet</div>
    </div>
    <div class="chips">
      <span class="chip" id="c-live"><i></i>Connecting</span>
      <span class="chip" id="c-auto"><i></i>Automation</span>
      <span class="chip" id="c-check">Last check</span>
      <span class="chip warn" id="c-gas" hidden><i></i>Low gas</span>
    </div>
  </header>

  <section class="kpis">
    <div class="card kpi">
      <div class="label sm ink-2">Market <span class="help" tabindex="0" data-tip="Kaufman efficiency ratio over 10 hourly candles. Below 0.30 the market is sideways (calm) and the grid trades; at 0.30 or above it is trending (storm) and Nagi stands still.">?</span></div>
      <div class="xl" id="k-market">–</div>
      <div class="xs muted" id="k-market-sub">&nbsp;</div>
    </div>
    <div class="card kpi">
      <div class="label sm ink-2">Hires <span class="help" tabindex="0" data-tip="ERC-8183 jobs where Nagi is the provider, read from chain. Clients counts distinct wallets other than Nagi's own.">?</span></div>
      <div class="xl" id="k-hires">–</div>
      <div class="xs muted" id="k-hires-sub">&nbsp;</div>
    </div>
    <div class="card kpi">
      <div class="label sm ink-2">Earned <span class="help" tabindex="0" data-tip="U paid out to Nagi by the ERC-8183 escrow, read from chain. Pending is the budget of hires still running or in their 15-minute review window.">?</span></div>
      <div class="xl" id="k-earned">–</div>
      <div class="xs muted" id="k-earned-sub">&nbsp;</div>
    </div>
    <div class="card kpi">
      <div class="label sm ink-2">Profit vs holding <span class="help" tabindex="0" data-tip="Paper P&amp;L of every onchain trade at the real BNB price of its minute, compared with simply holding BNB. Each rung is 0.002 BNB, so amounts are small; watch the sign and the trend.">?</span></div>
      <div class="xl" id="k-pnl">–</div>
      <div class="xs muted" id="k-pnl-sub">&nbsp;</div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2 class="lg">Set and Earn progress</h2>
      <span class="help" tabindex="0" data-tip="Build targets of the BNB Chain Set and Earn campaign: 3 completed hires from distinct outside wallets, 5 onchain actions, on 3 separate days.">?</span>
      <span class="aside sm ink-2" id="deadline"></span>
    </div>
    <div class="progress" id="progress"></div>
  </section>

  <div class="split">
    <section class="card">
      <div class="card-head">
        <h2 class="lg">Hires</h2>
        <span class="aside sm ink-2" id="hires-aside"></span>
      </div>
      <div class="list" id="hires"><div class="empty sm">Loading…</div></div>
    </section>
    <section class="card">
      <div class="card-head">
        <h2 class="lg">Grid</h2>
        <span class="help" tabindex="0" data-tip="Eight levels around the price when the grid opened, 0.5 × ATR apart. Price falling through a level buys 0.002 BNB, rising through one sells.">?</span>
        <span class="aside sm ink-2" id="grid-aside"></span>
      </div>
      <div id="ladder"><div class="empty sm">Loading…</div></div>
    </section>
  </div>

  <section class="card">
    <div class="card-head">
      <h2 class="lg">Activity</h2>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="trades" aria-selected="true">Trades</button>
        <button role="tab" data-tab="decisions" aria-selected="false">Decisions</button>
        <button role="tab" data-tab="payouts" aria-selected="false">Payouts</button>
      </div>
    </div>
    <div class="list" id="activity"><div class="empty sm">Loading…</div></div>
    <div class="xs muted" id="wallet" style="margin-top: var(--s-4)"></div>
  </section>

  <footer class="sm ink-2">
    <span>Owner <a class="mono" id="owner" target="_blank" rel="noopener" href="#">…</a></span>
    <a id="l-listing" target="_blank" rel="noopener" href="https://pokter.xyz">Hire on Pokter</a>
    <a target="_blank" rel="noopener" href="https://testnet.8004scan.io">ERC-8004 identity</a>
    <a target="_blank" rel="noopener" href="/.well-known/agent-card.json">Agent card</a>
    <a target="_blank" rel="noopener" href="https://github.com/salmon-tech404/nagi-grid-agent">Source</a>
    <span class="end muted" id="updated"></span>
  </footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short = (a) => a ? a.slice(0, 6) + "…" + a.slice(-4) : "";
const scan = (p) => "https://testnet.bscscan.com/" + p;
const dur = (s) => s < 60 ? s + "s" : s < 3600 ? Math.round(s / 60) + "m" : s < 86400 ? Math.round(s / 3600) + "h" : Math.round(s / 86400) + "d";
const ago = (ts) => { if (!ts) return ""; const s = Math.round(Date.now() / 1000 - ts); return s < 0 ? "in " + dur(-s) : dur(s) + " ago"; };
const money = (v) => (+v >= 0 ? "+$" : "−$") + Math.abs(+v).toFixed(+v !== 0 && Math.abs(+v) < 0.01 ? 4 : 2);
const tone = (v) => +v > 0 ? "pos" : +v < 0 ? "neg" : "";
const chip = (id, cls, text) => { const el = $(id); el.className = "chip " + cls; el.innerHTML = (cls ? "<i></i>" : "") + esc(text); };
const STATUS = { FUNDED: ["Running", "info"], SUBMITTED: ["In review", "info"], COMPLETED: ["Completed", "pos"],
                 REJECTED: ["Rejected", "neg"], EXPIRED: ["Expired", "neg"], OPEN: ["Not funded", ""] };
const DECISION = { "grid-open": ["Grid opened", "info"], "grid-stop": ["Grid reset", "warn"], pause: ["Paused", "warn"],
                   "session-standby": ["Hired · standing by", "warn"], "session-read-only": ["Hired · read-only", "info"],
                   skip: ["Skipped", ""], error: ["Error", "neg"] };
let data = null, tab = "trades";

function renderHeader(d) {
  const s = d.status;
  $("who-sub").textContent = `Grid agent #${d.agent.id} · BNB Chain testnet`;
  chip("c-live", "pos", "Live");
  chip("c-auto", s.automation ? "pos" : "", s.automation ? "Automation on" : "Automation off");
  $("c-check").className = "chip";
  $("c-check").textContent = s.last_check ? `Checked ${ago(s.last_check)} · every ${Math.round(s.interval / 60)}m` : "No check yet";
  $("c-gas").hidden = !s.gas_low;
  $("owner").textContent = short(d.agent.owner); $("owner").href = scan("address/" + d.agent.owner);
  $("l-listing").href = d.agent.listing;
}

function renderKpis(d) {
  const s = d.status, h = d.hires, e = d.earnings, p = d.performance;
  const m = $("k-market");
  m.textContent = s.market === "calm" ? "Calm" : s.market === "storm" ? "Storm" : "Waiting";
  m.className = "xl " + (s.market === "calm" ? "pos" : s.market === "storm" ? "warn" : "");
  $("k-market-sub").textContent = [s.price ? "BNB $" + (+s.price).toFixed(2) : null, s.er != null ? "ER " + (+s.er).toFixed(2) : null].filter(Boolean).join(" · ") || "first check pending";
  $("k-hires").textContent = h.total;
  $("k-hires-sub").textContent = `${h.clients} clients · ${h.running} running · ${h.completed} completed`;
  $("k-earned").textContent = (+e.earned_u).toFixed(2) + " U";
  $("k-earned-sub").textContent = `${(+e.pending_u).toFixed(2)} U pending · wallet ${d.wallet.u == null ? "…" : (+d.wallet.u).toFixed(2) + " U"}`;
  const k = $("k-pnl"); k.textContent = money(p.vs_hold_usd); k.className = "xl " + tone(p.vs_hold_usd);
  $("k-pnl-sub").textContent = `${p.trades} trades · ${p.round_trips} round trips`;
}

function renderProgress(d) {
  const g = d.progress;
  const left = Math.max(0, Math.ceil((g.deadline - Date.now() / 1000) / 86400));
  $("deadline").textContent = `${left} days left · closes 5 Nov 12:00 UTC`;
  const goals = [["Completed hires, distinct wallets", g.hires], ["Onchain actions", g.actions], ["Separate active days", g.days]];
  $("progress").innerHTML = goals.map(([label, x]) => {
    const pct = Math.min(100, Math.round((x.value / x.target) * 100));
    const done = x.value >= x.target;
    return `<div class="goal"><div class="row sm"><span class="ink-2">${label}</span>
      <span class="strong ${done ? "pos" : ""}">${x.value} / ${x.target}</span></div>
      <div class="bar"><span class="${done ? "done" : ""}" style="width:${pct}%"></span></div></div>`;
  }).join("");
}

function renderHires(d) {
  const h = d.hires;
  $("hires-aside").textContent = h.total ? `${h.total} total` : "";
  if (!h.jobs.length) {
    $("hires").innerHTML = `<div class="empty sm">No hires yet. <a target="_blank" rel="noopener" href="${esc(d.agent.listing)}">Open the listing on Pokter</a></div>`;
    return;
  }
  $("hires").innerHTML = h.jobs.map((j) => {
    const [label, cls] = STATUS[j.status] || [j.status, ""];
    const when = j.status === "FUNDED" && j.session_end ? "session ends " + ago(j.session_end)
               : j.submitted_at ? "delivered " + ago(j.submitted_at) : "";
    const report = j.report_url ? `<a target="_blank" rel="noopener" href="${esc(j.report_url)}">Report</a>` : "";
    return `<div class="item">
      <div class="line"><span class="strong">Job #${j.job_id}</span><span class="chip ${cls}"><i></i>${esc(label)}</span>
        ${j.read_only ? '<span class="chip">Read-only</span>' : ""}<span class="end sm ink-2">${(+j.budget_u).toFixed(2)} U</span></div>
      ${j.task ? `<div class="sm ink-2">“${esc(j.task)}”</div>` : ""}
      <div class="line xs muted"><span>by <a class="mono" target="_blank" rel="noopener" href="${scan("address/" + esc(j.client))}">${esc(short(j.client))}</a></span>
        ${when ? `<span>${esc(when)}</span>` : ""}${report ? `<span>${report}</span>` : ""}</div></div>`;
  }).join("");
}

function renderGrid(d) {
  const g = d.grid, s = d.status;
  if (!g) {
    $("grid-aside").textContent = "";
    $("ladder").innerHTML = s.market === "storm"
      ? '<div class="paused"><span class="md strong">Standing still</span><span class="sm">The market is trending. The grid reopens when it calms.</span></div>'
      : '<div class="empty sm">Waiting for the first market check.</div>';
    return;
  }
  $("grid-aside").textContent = `step $${(+g.step).toFixed(2)}`;
  const rows = g.levels.map((lv) => ({ lv, side: lv > g.center ? "sell" : "buy" }));
  if (s.price) rows.push({ lv: +s.price, side: "now" });
  rows.sort((a, b) => b.lv - a.lv);
  const name = { now: ["Price now", ""], sell: ["Sell", "warn"], buy: ["Buy", "pos"] };
  $("ladder").innerHTML = '<div class="ladder">' + rows.map((r) =>
    `<div class="lv ${r.side === "now" ? "now" : ""}"><span class="sm strong ${name[r.side][1]}">${name[r.side][0]}</span><span class="md">$${r.lv.toFixed(2)}</span></div>`
  ).join("") + "</div>";
}

function renderActivity(d) {
  const w = d.wallet;
  $("wallet").textContent = w.tbnb == null ? "" :
    `Wallet ${(+w.tbnb).toFixed(4)} tBNB · ${(+w.busd).toFixed(2)} BUSD · ${(+w.u).toFixed(2)} U. Trades and payouts are read from chain; decisions since ${new Date(d.status.started_at * 1000).toLocaleString()}.`;
  let rows = [];
  if (tab === "trades") {
    rows = d.trades.map((t) => {
      const buy = t.action === "buy";
      const qty = (t.amount_bnb_wei / 1e18).toFixed(3);
      return [buy ? "pos" : "warn", buy ? "Bought" : "Sold",
        `${qty} BNB${t.price_ref ? " at $" + (+t.price_ref).toFixed(2) : ""} · <a target="_blank" rel="noopener" href="${scan("tx/" + esc(t.tx))}">View tx</a>`, t.ts];
    });
  } else if (tab === "decisions") {
    rows = d.decisions.map((e) => {
      const [label, cls] = DECISION[e.kind] || [e.kind, ""];
      return [cls, label, esc(e.note || e.reason || ""), e.ts];
    });
  } else {
    rows = d.earnings.payouts.map((p) => ["pos", "Paid", `${(+p.amount_u).toFixed(2)} U from escrow · <a target="_blank" rel="noopener" href="${scan("tx/" + esc(p.tx))}">View tx</a>`, p.ts]);
  }
  const empty = { trades: "No trades yet. Nagi trades when the market is calm and price crosses a grid level.",
                  decisions: "No decisions since the last restart.", payouts: "No payouts yet. Each completed hire pays out here." };
  $("activity").innerHTML = rows.length ? rows.slice(0, 20).map(([cls, what, detail, ts]) =>
    `<div class="item"><div class="line"><span class="dot ${cls}"></span><span class="strong">${what}</span>
      <span class="sm ink-2">${detail}</span><span class="end xs muted">${esc(ago(ts))}</span></div></div>`
  ).join("") : `<div class="empty sm">${empty[tab]}</div>`;
}

document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  if (data) renderActivity(data);
}));

async function load() {
  try {
    data = await (await fetch("/overview")).json();
    renderHeader(data); renderKpis(data); renderProgress(data); renderHires(data); renderGrid(data); renderActivity(data);
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (err) {
    chip("c-live", "neg", "Offline");
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
